<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="theme-bg login-page">
    <main class="stage">
        <section class="glass-card split-card login-card">
            <div class="panel-left">
                <h1 class="title">Create Account</h1>
                <p class="subtitle">Join Classical Mudra Detection</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert {{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="post" class="form-grid">
                    <label>
                        <span>Username</span>
                        <input type="text" name="username" placeholder="Choose a username" required>
                    </label>
                    <label>
                        <span>Password</span>
                        <input type="password" name="password" placeholder="Choose a password" required>
                    </label>
                    <label>
                        <span>Confirm Password</span>
                        <input type="password" name="confirm_password" placeholder="Re-enter password" required>
                    </label>
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                </form>
                <p class="hint">Already have an account? <a class="text-link" href="{{ url_for('login') }}">Login</a></p>
            </div>

            <div class="panel-right art-panel">
                <div class="classical-frame">
                    <img class="login-dancer-image" src="{{ url_for('static', filename='css/dancer.jpeg') }}" alt="Classical dancer silhouette">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
